name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          required=(
            FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN
            FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_APP_ID
            FIREBASE_MEASUREMENT_ID
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done

          mkdir -p dist
          cp index.html styles.css notas.png notas.icns notas-icon.png dist/
          cp -r js dist/
          touch dist/.nojekyll

          {
            echo "window.__env = {"
            echo "  FIREBASE_API_KEY:             '${FIREBASE_API_KEY}',"
            echo "  FIREBASE_AUTH_DOMAIN:         '${FIREBASE_AUTH_DOMAIN}',"
            echo "  FIREBASE_PROJECT_ID:          '${FIREBASE_PROJECT_ID}',"
            echo "  FIREBASE_STORAGE_BUCKET:      '${FIREBASE_STORAGE_BUCKET}',"
            echo "  FIREBASE_MESSAGING_SENDER_ID: '${FIREBASE_MESSAGING_SENDER_ID}',"
            echo "  FIREBASE_APP_ID:              '${FIREBASE_APP_ID}',"
            echo "  FIREBASE_MEASUREMENT_ID:      '${FIREBASE_MEASUREMENT_ID}'"
            echo "};"
          } > dist/firebase-config.local.js

      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/js/app.js
          test -s dist/notas.png
          test -s dist/notas.icns
          test -s dist/notas-icon.png
          test -s dist/firebase-config.local.js
          ! grep -E "__FIREBASE_[A-Z_]+__" dist/firebase-config.local.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
